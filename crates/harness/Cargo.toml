[package]
name = "valo-harness"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wait-timeout = "0.2"
rustix = { version = "1.1", features = ["event", "process"] }
valo-ipc = { path = "../valo-ipc" }
valo-launch = { path = "../valo-launch" }
