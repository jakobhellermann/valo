[package]
name = "valo"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["assert-no-alloc", "structured-log"]
assert-no-alloc = ["dep:assert_no_alloc"]
structured-log = []

[dependencies]
ash = { version = "0.38.0", default-features = false }
assert_no_alloc = { version = "1.1", default-features = false, optional = true }
bitflags = "2.10"
detour = "0.10"
epaint = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
heapless = "0.9"
libc = "0.2"
linkme = "0.3.37"
memchr = "2.7"
rustix = { version = "1.1", features = ["fs", "mm", "event", "net", "time", "pipe", "thread", "process"] }
valo-ipc = { path = "../valo-ipc" }
valo-launch = { path = "../valo-launch" }
vulkan-headers = "0.2"
x11rb-protocol = "0.14"

[build-dependencies]
cc = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
