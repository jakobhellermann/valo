[package]
name = "valo-client"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "valo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }
ratatui = "0.30.0"
valo-ipc = { path = "../valo-ipc" }
valo-launch = { path = "../valo-launch" }
x11rb = "0.14"
