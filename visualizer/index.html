<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>valo visualizer</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        margin: 1rem;
        background: #111;
        color: #ccc;
      }
      h1 {
        font-size: 1.2rem;
      }
      h2 {
        font-size: 1rem;
        color: #9cf;
      }
      select {
        background: #222;
        color: #ccc;
        border: 1px solid #444;
        padding: 4px 8px;
      }
      button {
        background: #422;
        color: #fbb;
        border: 1px solid #644;
        padding: 4px 8px;
        cursor: pointer;
      }
      button:hover {
        background: #533;
      }
      button:active {
        background: #311;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      #layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
      #view {
        min-width: 0;
      }
      #view > table {
        width: 100%;
      }
      #view > table > tbody > tr:first-child > th:not(:last-child),
      #view > table > tbody > tr.area-row > td:not(:last-child) {
        width: 1%;
        white-space: nowrap;
      }

      .run {
        margin-bottom: 0.75rem;
      }
      .run-head {
        color: #888;
        padding: 2px 8px;
        font-size: 0.85rem;
      }
      .seg {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        color: inherit;
        text-align: left;
        font: inherit;
        padding: 3px 8px 3px 20px;
        cursor: pointer;
      }
      .seg:hover {
        background: #1a1a1a;
      }
      .seg.active {
        background: #223;
      }
      .seg.restore {
        color: #9cf;
      }
      .seg.aborted {
        color: #f88;
      }
      .dim {
        color: #666;
        font-size: 0.85rem;
      }
      .mismatch {
        color: #f66;
      }

      table {
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        padding: 2px 8px;
        text-align: left;
        border-bottom: 1px solid #222;
      }
      .skip {
        color: #555;
      }
      .bar {
        display: inline-block;
        height: 8px;
        background: #4a9;
        border-radius: 2px;
        vertical-align: middle;
      }
      .bar.skip {
        background: #333;
      }
      .bar:hover {
        background: #7df;
      }
      .bar.skip:hover {
        background: #555;
      }
      td.size {
        color: #999;
        white-space: nowrap;
      }
      .bad td {
        background: #301;
      }
      .bad.skip td {
        background: transparent;
      }
      .area-detail td {
        padding: 0 8px;
        overflow-wrap: anywhere;
      }
      .area-detail:not(:has(details[open])) {
        display: none;
      }
      .area-row {
        cursor: pointer;
      }
      .area-toggle {
        background: transparent;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 0;
        text-align: left;
      }
      .area-toggle:hover {
        background: transparent;
        color: #9cf;
      }
      .area-toggle:active {
        background: transparent;
      }
      .seg:focus-visible,
      .area-toggle:focus-visible {
        outline: 2px solid #9cf;
        outline-offset: 2px;
      }
      .area-detail details[open] {
        padding-bottom: 8px;
      }
      .area-detail summary {
        cursor: pointer;
        color: #9cf;
      }
      .page-content {
        max-height: 400px;
        overflow: auto;
      }
      .page-nav {
        margin: 8px 0;
      }
      .global-stats {
        margin: 2rem 0;
        border-top: 1px solid #444;
      }
      .fd-list {
        margin: 1rem 0;
        border-top: 1px solid #444;
      }
      .fd-list summary {
        cursor: pointer;
        color: #9cf;
        padding: 4px 0;
      }
      .fd-list table {
        margin: 4px 0 8px;
      }
      .fd-list table > tbody > tr:first-child > th:not(:last-child),
      .fd-list table > tbody > tr > td:not(:last-child) {
        width: 1%;
        white-space: nowrap;
      }
      .fd-list table > tbody > tr > td:last-child {
        overflow-wrap: anywhere;
      }
      .global-stats h3 {
        color: #9cf;
        font-size: 1rem;
      }
      .global-stats th {
        color: #999;
        font-weight: normal;
      }
      .global-stats td {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>valo visualizer</h1>
    <select id="file"></select>
    <button id="open-perfetto">open in Perfetto</button>
    <button id="perfetto">download Perfetto trace</button>
    <button id="delete">delete saved logs</button>
    <div id="layout">
      <div id="tree"></div>
      <div id="view"></div>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
